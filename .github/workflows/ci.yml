name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Actions are pinned to full commit SHAs; Dependabot keeps the SHAs and version comments current.
  checks:
    # The one combination the dev setup pins today. Which PHP, Laravel, Filament
    # and Pulse versions to cover is decided in #11.
    name: PHP 8.4, Laravel 13
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: dom, fileinfo, intl, mbstring, pdo_sqlite, sqlite3, zip
          coverage: none

      - id: install
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: highest

      # Run every check even when an earlier one fails, so one push reports them all.
      - name: Formatting (Pint)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer analyse

      - name: Tests (Pest)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer test

version: 2

updates:
  # Keeps the SHA-pinned actions in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  # A library has no composer.lock, so this only widens composer.json
  # constraints when a dependency ships a version they don't allow yet.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: widen
    cooldown:
      default-days: 7
    groups:
      composer:
        patterns: ["*"]

  # Keeps Tailwind, which builds the Pulse widget stylesheet, and Playwright, which
  # the browser tests drive, current. A Tailwind update needs the stylesheet rebuilt
  # and committed, so it gets its own pull request and never holds up Playwright's.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
      npm:
        patterns: ["*"]
